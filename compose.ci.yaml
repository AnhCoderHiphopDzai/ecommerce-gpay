# Disposable CI stack. Jenkins runs it under a unique project name and removes its volumes afterward.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: shop_ci
      MYSQL_ROOT_PASSWORD: ${CI_DB_PASSWORD:?CI_DB_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  unit-test:
    image: maven:3.9-eclipse-temurin-21
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace
    volumes:
      - ./demo:/workspace
    environment:
      HOME: /tmp
      MAVEN_OPTS: -Dmaven.repo.local=/tmp/.m2
    command: ["mvn", "-B", "-Dgroups=unit", "test"]

  integration-test:
    image: maven:3.9-eclipse-temurin-21
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace
    volumes:
      - ./demo:/workspace
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HOME: /tmp
      MAVEN_OPTS: -Dmaven.repo.local=/tmp/.m2
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/shop_ci?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${CI_DB_PASSWORD:?CI_DB_PASSWORD is required}
      SPRING_DATA_REDIS_HOST: redis
      APP_JWT_SECRET: ${CI_JWT_SECRET:?CI_JWT_SECRET is required}
      APP_CORS_ALLOWED_ORIGINS: http://frontend
      APP_FRONTEND_URL: http://frontend
      SERVER_SSL_ENABLED: "false"
    command: ["mvn", "-B", "-Dgroups=integration", "test"]

  backend:
    image: ${BACKEND_IMAGE:-demo1-backend:ci-unused}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/shop_ci?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${CI_DB_PASSWORD:?CI_DB_PASSWORD is required}
      SPRING_DATA_REDIS_HOST: redis
      APP_JWT_SECRET: ${CI_JWT_SECRET:?CI_JWT_SECRET is required}
      APP_CORS_ALLOWED_ORIGINS: http://frontend
      APP_FRONTEND_URL: http://frontend
      SERVER_SSL_ENABLED: "false"
      GPAY_CLIENT_SECRET: ci-test-client-secret
      GPAY_PRIVATE_KEY: ci-test-private-key
      GPAY_CERTIFICATE: ci-test-certificate
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 18

  frontend:
    image: ${FRONTEND_IMAGE:-demo1-frontend:ci-unused}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  smoke:
    image: curlimages/curl:8.11.1
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    volumes:
      - ./ci:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/smoke-candidate.sh"]
