services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: shop
      MYSQL_ROOT_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE:-demo1-backend:latest}
    build:
      context: ./demo
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/shop?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      SPRING_DATA_REDIS_HOST: redis
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET is required}
      GPAY_CLIENT_SECRET: ${GPAY_CLIENT_SECRET:?GPAY_CLIENT_SECRET is required}
      GPAY_PRIVATE_KEY: ${GPAY_PRIVATE_KEY:?GPAY_PRIVATE_KEY is required}
      GPAY_CERTIFICATE: ${GPAY_CERTIFICATE:?GPAY_CERTIFICATE is required}
      APP_CORS_ALLOWED_ORIGINS: http://${DEPLOY_HOST:-192.168.179.129}:${FRONTEND_PORT:-8088}
      APP_FRONTEND_URL: http://${DEPLOY_HOST:-192.168.179.129}:${FRONTEND_PORT:-8088}
      APP_AUTH_REFRESH_COOKIE_SECURE: "false"
      SERVER_SSL_ENABLED: "false"
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 12

  frontend:
    image: ${FRONTEND_IMAGE:-demo1-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://${DEPLOY_HOST:-192.168.179.129}:${BACKEND_PORT:-8081}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6

volumes:
  mysql-data:
  redis-data:
