services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: shop
      MYSQL_ROOT_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./demo
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/shop?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-}
      SPRING_DATA_REDIS_HOST: redis
      APP_JWT_SECRET: ${APP_JWT_SECRET:-}
      GPAY_CLIENT_SECRET: ${GPAY_CLIENT_SECRET:-}
      GPAY_PRIVATE_KEY: ${GPAY_PRIVATE_KEY:-}
      GPAY_CERTIFICATE: ${GPAY_CERTIFICATE:-}
      APP_CORS_ALLOWED_ORIGINS: http://${DEPLOY_HOST:-192.168.179.129}:${FRONTEND_PORT:-8088}
      APP_FRONTEND_URL: http://${DEPLOY_HOST:-192.168.179.129}:${FRONTEND_PORT:-8088}
      SERVER_SSL_ENABLED: "false"
    ports:
      - "${BACKEND_PORT:-8081}:8081"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://${DEPLOY_HOST:-192.168.179.129}:${BACKEND_PORT:-8081}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8088}:80"

volumes:
  mysql-data:
  redis-data:
