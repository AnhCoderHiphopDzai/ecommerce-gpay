# This profile only runs against disposable MySQL and Redis services created by CI.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/shop_ci?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ci-test-only-password}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
server.ssl.enabled=false
app.jwt.secret=${APP_JWT_SECRET:ci-test-jwt-secret-not-for-deployment-1234567890}
app.jwt.expiration-minutes=15
app.auth.refresh-cookie-secure=false
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://frontend}
app.frontend.url=${APP_FRONTEND_URL:http://frontend}
app.admin.email=ci-admin@example.test
gpay.client-secret=ci-test-client-secret
gpay.certificate=ci-test-certificate
gpay.private-key=ci-test-private-key
gpay.webhook-url=http://example.test/api/payment/webhook
gpay.callback-url=http://example.test/api/payment/callback
spring.task.scheduling.enabled=false
