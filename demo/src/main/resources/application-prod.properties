# Public HTTPS is terminated by Caddy; backend has no host port.
server.ssl.enabled=false
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
app.auth.refresh-cookie-secure=true
app.admin.email=${APP_ADMIN_EMAIL:}
app.payments.enabled=${APP_PAYMENTS_ENABLED:false}
gpay.api.base-url=${GPAY_API_BASE_URL:https://openapi-sandbox.g-pay.vn/v1}
gpay.client-id=${GPAY_CLIENT_ID:disabled}
gpay.merchant-code=${GPAY_MERCHANT_CODE:disabled}
gpay.merchant-id=${GPAY_MERCHANT_ID:disabled}
gpay.webhook-url=${GPAY_WEBHOOK_URL}
gpay.callback-url=${GPAY_CALLBACK_URL}
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF
gpay.public-key-location=${GPAY_PUBLIC_KEY_LOCATION:file:/run/gpay/public.pem}
